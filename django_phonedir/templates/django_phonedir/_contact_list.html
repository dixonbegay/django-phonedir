{% load phonedir_tags %}
{% if contacts %}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {% for contact in contacts|dictsort:"last_name" %}
            {% render_contact contact %}
        {% endfor %}
    </div>
{% else %}
    <p>No contacts listed.</p>
{% endif %}
